name: inflate-restore-payload
on:
  push:
    branches: [cursor/data-calibration-bluechips-354a]
    paths:
      - '__restore_payload/**'
      - '.github/workflows/inflate-restore-payload.yml'
permissions:
  contents: write
jobs:
  inflate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/data-calibration-bluechips-354a
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inflate restored sources
        run: |
          python3 <<'PY'
          import base64, gzip, json, pathlib, hashlib
          root = pathlib.Path('__restore_payload')
          man = root / 'MANIFEST.json'
          assert man.exists(), 'missing MANIFEST'
          manifest = json.loads(man.read_text())
          for path, meta in manifest.items():
            b64 = ''.join((root / p).read_text().strip() for p in meta['parts'])
            raw = gzip.decompress(base64.b64decode(b64))
            assert hashlib.md5(raw).hexdigest() == meta['md5'], path
            dest = pathlib.Path(path)
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_bytes(raw)
            print('wrote', path, len(raw))
            text = raw.decode()
            if path.endswith('grade.ts'):
              assert 'export function majorityShareCeiling' in text
              assert 'maxShare <= shareCeiling' in text
              assert 'PLACEHOLDER' not in text
              assert len(raw) > 10000
            if path.endswith('evm.ts'):
              assert 'pool_age' in text
              assert 'majorityShareCeiling' in text
          for p in list(root.iterdir()):
            p.unlink()
          print('ok')
          PY
      - name: Commit restored files
        run: |
          set -euo pipefail
          git config user.name "Cyredev"
          git config user.email "milesfrancisco73@gmail.com"
          git add lib/guardian/grade.ts lib/adapters/evm.ts
          git commit -m "fix(scan): restore grade.ts with scaled majority ceiling" || true
          git rm -rf __restore_payload || true
          git rm -f .github/workflows/inflate-restore-payload.yml || true
          git rm -rf .restore-tmp || true
          git rm -f .github/workflows/restore-grade-evm-once.yml || true
          git commit -m "chore: remove one-shot restore artifacts" || true
          git push
