name: restore-grade-evm-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/data-calibration-bluechips-354a
      - name: Assemble restored sources
        run: |
          set -euo pipefail
          mkdir -p lib/guardian lib/adapters
          test -f .restore-tmp/grade.part00
          test -f .restore-tmp/grade.part01
          test -f .restore-tmp/grade.part02
          test -f .restore-tmp/grade.part03
          cat .restore-tmp/grade.part00 .restore-tmp/grade.part01 .restore-tmp/grade.part02 .restore-tmp/grade.part03 > lib/guardian/grade.ts
          wc -c lib/guardian/grade.ts
          test "$(wc -c < lib/guardian/grade.ts)" -gt 10000
          grep -q 'export function majorityShareCeiling' lib/guardian/grade.ts
          grep -q 'maxShare <= shareCeiling' lib/guardian/grade.ts
          ! grep -q PLACEHOLDER lib/guardian/grade.ts
          if test -f .restore-tmp/evm.part00 && test -f .restore-tmp/evm.part01 && test -f .restore-tmp/evm.part02 && test -f .restore-tmp/evm.part03 && test -f .restore-tmp/evm.part04 && test -f .restore-tmp/evm.part05; then
            cat .restore-tmp/evm.part00 .restore-tmp/evm.part01 .restore-tmp/evm.part02 .restore-tmp/evm.part03 .restore-tmp/evm.part04 .restore-tmp/evm.part05 > lib/adapters/evm.ts
            wc -c lib/adapters/evm.ts
            grep -q 'pool_age' lib/adapters/evm.ts
            grep -q 'majorityShareCeiling' lib/adapters/evm.ts
          else
            echo 'evm parts incomplete — skipping evm.ts'
          fi
      - name: Commit restored files
        run: |
          set -euo pipefail
          git config user.name "Cyredev"
          git config user.email "milesfrancisco73@gmail.com"
          git add lib/guardian/grade.ts
          if [ -f lib/adapters/evm.ts ] && grep -q pool_age lib/adapters/evm.ts; then git add lib/adapters/evm.ts; fi
          if git diff --cached --quiet; then echo 'no changes'; else
            git commit -m "fix(scan): restore grade.ts with scaled majority ceiling"
          fi
          git rm -r .restore-tmp || true
          git rm -f .github/workflows/restore-grade-evm-once.yml || true
          git commit -m "chore: remove one-shot restore artifacts" || true
          git push origin HEAD:cursor/data-calibration-bluechips-354a
