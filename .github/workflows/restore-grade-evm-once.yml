name: restore-grade-evm-once
on:
  workflow_dispatch:
  push:
    paths:
      - '.restore-tmp/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/data-calibration-bluechips-354a
      - name: Assemble grade.ts and evm.ts
        run: |
          set -euo pipefail
          mkdir -p lib/guardian lib/adapters
          cat .restore-tmp/grade.part* > lib/guardian/grade.ts
          cat .restore-tmp/evm.part* > lib/adapters/evm.ts
          wc -c lib/guardian/grade.ts lib/adapters/evm.ts
          grep -q 'export function majorityShareCeiling' lib/guardian/grade.ts
          grep -q 'maxShare <= shareCeiling' lib/guardian/grade.ts
          ! grep -q PLACEHOLDER lib/guardian/grade.ts
          grep -q 'pool_age' lib/adapters/evm.ts
          grep -q 'majorityShareCeiling' lib/adapters/evm.ts
      - name: Commit restored files
        run: |
          set -euo pipefail
          git config user.name "Cyredev"
          git config user.email "milesfrancisco73@gmail.com"
          git add lib/guardian/grade.ts lib/adapters/evm.ts
          git commit -m "fix(scan): restore grade.ts with scaled majority ceiling" || echo "no grade change"
          if ! git diff --cached --quiet; then git commit -m "fix(scan): explorer contract age + scaled majority LP copy"; fi
          git rm -r .restore-tmp || true
          git rm -f .github/workflows/restore-grade-evm-once.yml || true
          git commit -m "chore: remove one-shot restore artifacts" || true
          git push origin HEAD:cursor/data-calibration-bluechips-354a
