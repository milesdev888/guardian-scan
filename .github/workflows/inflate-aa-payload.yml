name: inflate-aa-payload
on:
  push:
    branches: [cursor/grade-aa-platinum-354a]
    paths:
      - '__aa_payload/**'
      - '.github/workflows/inflate-aa-payload.yml'
permissions:
  contents: write
jobs:
  inflate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/grade-aa-platinum-354a
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inflate payload files
        run: |
          python3 <<'PY'
          import base64, gzip, json, pathlib, hashlib
          root = pathlib.Path('__aa_payload')
          if not root.exists():
            print('no payload dir')
            raise SystemExit(0)
          man = root / 'MANIFEST.json'
          if not man.exists() and (root / 'DONE.json').exists():
            print('already inflated')
            raise SystemExit(0)
          changed = []
          # 1) chunked manifests
          if man.exists():
            manifest = json.loads(man.read_text())
            for path, meta in manifest.items():
              b64 = ''.join((root / p).read_text().strip() for p in meta['parts'])
              raw = gzip.decompress(base64.b64decode(b64))
              assert hashlib.md5(raw).hexdigest() == meta['md5'], path
              dest = pathlib.Path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)
              changed.append(path)
              print('wrote chunked', path, len(raw))
          # 2) legacy single-json payloads
          for p in sorted(root.glob('*.json')):
            if p.name in ('DONE.json', 'MANIFEST.json'):
              continue
            data = json.loads(p.read_text())
            for path, meta in data.items():
              if path in changed:
                continue
              raw = gzip.decompress(base64.b64decode(meta['gz_b64']))
              assert hashlib.md5(raw).hexdigest() == meta['md5'], path
              dest = pathlib.Path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)
              changed.append(path)
              print('wrote json', path, len(raw))
          # cleanup payload artifacts
          for p in list(root.iterdir()):
            if p.is_file() and p.name != 'DONE.json':
              p.unlink()
          pathlib.Path('__aa_payload/DONE.json').write_text('{"ok":true}\n')
          print('changed', changed)
          if not changed:
            raise SystemExit('no files inflated')
          PY
      - name: Commit inflated files
        run: |
          git config user.name "Cyredev"
          git config user.email "milesfrancisco73@gmail.com"
          rm -f __aa_push_probe.txt
          # remove one-shot inflate workflow after success
          rm -f .github/workflows/inflate-aa-payload.yml
          git add -A
          if git diff --cached --quiet; then echo 'nothing'; exit 0; fi
          git commit -m "$(cat <<'EOF'
          feat(scan): Grade AA platinum + unified grade colors

          Add AA eligibility (score≥90, age≥365d, permanent/established LP,
          revoked authorities, zero fraud) without rounding up from score.
          Unify AA/A/B/C/D/F colors across UI and share cards; show Proven
          line on AA reports; replace "% secured" with "% locked".
          EOF
          )"
          git push
