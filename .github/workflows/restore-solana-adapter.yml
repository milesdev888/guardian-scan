name: restore-solana-adapter
on:
  push:
    paths:
      - '.restore/solana.ts.b64.0'
      - '.restore/solana.ts.b64.1'
      - '.restore/solana.ts.b64.2'
      - '.github/workflows/restore-solana-adapter.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/solana-scan-perf-354a
      - name: Assemble and commit solana adapter
        run: |
          set -euo pipefail
          cat .restore/solana.ts.b64.0 .restore/solana.ts.b64.1 .restore/solana.ts.b64.2 | base64 -d > lib/adapters/solana.ts
          EXPECTED=76be8c8fc1afec2b39aa56df4069b644b5098439b3eafd7505418eaa42cae2ed
          ACTUAL=$(sha256sum lib/adapters/solana.ts | awk '{print $1}')
          echo "sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf .restore
          git config user.name "Cyredev"
          git config user.email "milesfrancisco73@gmail.com"
          git add lib/adapters/solana.ts
          git add -u .restore || true
          git commit -m "fix(scan): restore exact Solana adapter with parallel 8s timeouts" || echo "no changes"
          git push origin HEAD:cursor/solana-scan-perf-354a
