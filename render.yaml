# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: guardian-scan
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: X402_REQUIRE_PAYMENT
        value: "false"
